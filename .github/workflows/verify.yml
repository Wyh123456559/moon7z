name: Archive verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js]
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
      - run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: moon version --all
      - run: moon update
      - run: moon run checks/verify.mbtx -- ${{ matrix.target }}
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os != 'Windows'
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
      - if: runner.os != 'Windows'
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Invoke-Expression (Invoke-RestMethod 'https://cli.moonbitlang.com/install/powershell.ps1')
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_PATH -Value "$env:USERPROFILE\.moon\bin"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: moon version --all
      - run: moon update
      - run: moon run checks/verify.mbtx -- native
